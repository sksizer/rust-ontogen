# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/),
and this project adheres to [Semantic Versioning](https://semver.org/).

"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{%- if breaking | length > 0 %}
    ### ⚠ BREAKING CHANGES
    {% for commit in breaking %}
        - {{ commit.message | split(pat="\n") | first | trim }}\
        {%- if commit.breaking_description and commit.breaking_description != commit.message %}
          {{ commit.breaking_description | trim }}\
        {%- endif %}
    {% endfor %}
{%- endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim }}\
        {%- if commit.breaking %} **(breaking)**{% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    # A `merge: …` subject is a conventional commit as far as the parser is
    # concerned, so without this the stack-merge commits form their own
    # "### merge" section in the release notes.
    { message = "^merge", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^refactor", group = "Changed" },
    { message = "^perf", group = "Changed" },
    { message = "^revert", group = "Removed" },
    { message = "^security", group = "Security" },
    # Skip these commit types
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^docs", skip = true },
    { message = "^style", skip = true },
    { message = "^ai", skip = true },
    { message = "^test", skip = true },
    { message = "^build", skip = true },
]
protect_breaking_commits = false
filter_commits = false
# No `tag_pattern`. release-plz creates crate-prefixed tags in a workspace
# (`ontogen-v0.7.0`, `ontogen-core-v0.5.0`), and the previous pattern
# `v[0-9].*` matched none of them -- only the four legacy tags from before the
# workspace split (`v0.1.0` .. `v0.3.0`). git-cliff could then find no current
# release to bound the range and emitted an almost-empty changelog, which is
# how the 0.7.1 release PR came to list one commit out of fourteen. Unset,
# every tag counts, so the newest one bounds the range correctly; release-plz
# passes the per-package range explicitly regardless.
sort_commits = "oldest"

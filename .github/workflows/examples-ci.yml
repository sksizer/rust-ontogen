# Builds example apps when a PR touches them. Examples live OUTSIDE the root
# cargo workspace, so the main CI never compiles them; this path-filtered
# workflow is the guard. NOT a required check (a path-filtered required
# check would permanently block PRs that don't touch examples).
#
# Each build also guards against generator drift. The examples commit their
# generated trees so diffs stay reviewable, but nothing regenerates them —
# an example's build.rs only runs when that example is built. Building here
# regenerates in place, so inspecting the working tree afterwards is exactly
# "what the committed output is missing". Without this the trees drift
# silently: they had fallen four minor releases behind before anyone noticed.
#
# The filter below has to list everything that can change emitted output, or
# the guard is only as good as its triggers. That is more than `src/**`: the
# generators also live in `crates/ontogen-core` (naming, IR and model decide
# the emitted names), `crates/ontogen-ts` (the TS bindings emitter) and
# `crates/ontogen-macros`; `rustfmt.toml` decides how generated Rust is
# formatted, because `rustfmt_string` resolves config upward from the build
# script's cwd; and the root `Cargo.toml` carries the version that lands in
# every example lockfile.
name: "Examples"

on:
  pull_request:
    paths:
      - "examples/**"
      - "crates/markdown-store/**"
      - "crates/ontogen-core/**"
      - "crates/ontogen-ts/**"
      - "crates/ontogen-macros/**"
      - "src/**"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - ".github/workflows/examples-ci.yml"
      - ".github/scripts/check-generated-drift.sh"

concurrency:
  group: "examples-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # One matrix rather than four near-identical jobs, so adding an example means
  # editing one list here. `just regen-examples` keeps its own list for local
  # use; see the note in the justfile.
  build:
    name: "${{ matrix.name }}"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "iron-log-md"
            dir: "examples/iron-log-md"
            manifest: "examples/iron-log-md/Cargo.toml"
            cmd: "build"
            tauri: false
          - name: "tasks-tracker"
            dir: "examples/tasks-tracker"
            manifest: "examples/tasks-tracker/Cargo.toml"
            cmd: "build"
            tauri: false
          - name: "notes-kb"
            dir: "examples/notes-kb"
            manifest: "examples/notes-kb/Cargo.toml"
            cmd: "build"
            tauri: false
          - name: "iron-log"
            dir: "examples/iron-log"
            manifest: "examples/iron-log/src-tauri/Cargo.toml"
            cmd: "check"
            tauri: true
    steps:
      - uses: "actions/checkout@v4"
      # No explicit `toolchain:` input, so the action resolves
      # rust-toolchain.toml and CI agrees with a local `just regen-examples` on
      # one source of truth. Both still track whatever `stable` is that day —
      # pinning an exact version there is what would make generated rustfmt
      # output properly reproducible.
      - uses: "actions-rust-lang/setup-rust-toolchain@v1"
      # iron-log is a Tauri app; building it compiles native GTK/WebKit crates
      # (gobject-sys, webkit2gtk-sys, …) that need system -dev libraries the
      # GitHub image doesn't ship. Without these it fails with e.g.
      # "system library `gobject-2.0` … was not found".
      - name: "Install Tauri system dependencies"
        if: "${{ matrix.tauri }}"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf
      # `--locked` is how the lockfiles are guarded: a stale one fails here
      # rather than being silently rewritten. That is why the drift check
      # excludes lockfiles — this covers them, with a clearer error.
      - run: "cargo ${{ matrix.cmd }} --locked --manifest-path ${{ matrix.manifest }}"
      - name: "Committed generator output is current"
        run: ".github/scripts/check-generated-drift.sh ${{ matrix.dir }}"

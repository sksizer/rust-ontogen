# Builds example apps when a PR touches them. Examples live OUTSIDE the root
# cargo workspace, so the main CI never compiles them; this path-filtered
# workflow is the guard. NOT a required check (a path-filtered required
# check would permanently block PRs that don't touch examples).
#
# Each job also guards against generator drift. The examples commit their
# generated trees so diffs stay reviewable, but nothing regenerates them —
# an example's build.rs only runs when that example is built. Building here
# regenerates in place, so a `git diff` afterwards is exactly "what the
# committed output is missing". Without this the trees drift silently: they
# had fallen four minor releases behind before anyone noticed, still carrying
# ontogen 0.3.1 in a lockfile.
#
# The `src/**` path filter is what makes the guard meaningful — a generator
# change is the only thing that can invalidate committed output, and it
# always triggers this workflow.
name: "Examples"

on:
  pull_request:
    paths:
      - "examples/**"
      - "crates/markdown-store/**"
      - "src/**"

concurrency:
  group: "examples-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  iron-log-md:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions-rust-lang/setup-rust-toolchain@v1"
        with:
          toolchain: "stable"
      - run: "cargo build --manifest-path examples/iron-log-md/Cargo.toml"
      - name: "Committed generator output is current"
        run: ".github/scripts/check-generated-drift.sh examples/iron-log-md"

  tasks-tracker:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions-rust-lang/setup-rust-toolchain@v1"
        with:
          toolchain: "stable"
      - run: "cargo build --manifest-path examples/tasks-tracker/Cargo.toml"
      - name: "Committed generator output is current"
        run: ".github/scripts/check-generated-drift.sh examples/tasks-tracker"

  notes-kb:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions-rust-lang/setup-rust-toolchain@v1"
        with:
          toolchain: "stable"
      - run: "cargo build --manifest-path examples/notes-kb/Cargo.toml"
      - name: "Committed generator output is current"
        run: ".github/scripts/check-generated-drift.sh examples/notes-kb"

  iron-log:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions-rust-lang/setup-rust-toolchain@v1"
        with:
          toolchain: "stable"
      # iron-log is a Tauri app; `cargo check` builds native GTK/WebKit crates
      # (gobject-sys, webkit2gtk-sys, …) that need system -dev libraries the
      # GitHub image doesn't ship. Without these it fails with e.g.
      # "system library `gobject-2.0` … was not found".
      - name: "Install Tauri system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf
      - run: "cargo check --manifest-path examples/iron-log/src-tauri/Cargo.toml"
      - name: "Committed generator output is current"
        run: ".github/scripts/check-generated-drift.sh examples/iron-log"

# TODO: review - autogenerated crate manifest
[package]
name = "ontogen-core"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Shared types, IR definitions, and utilities for the ontogen code generation pipeline"
license = "MIT"
repository = "https://github.com/sksizer/rust-ontogen"

[features]
# Runtime support for generated event ops (`events` module). A crate whose
# API declares event ops depends on ontogen-core with this feature.
events = ["dep:serde", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["sync", "rt"], optional = true }

[dev-dependencies]
# Enables `events` for this crate's own tests and lints.
ontogen-core = { path = ".", features = ["events"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
